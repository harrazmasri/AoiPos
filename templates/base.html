{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOIPos{% block title %}{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <link rel="icon" type="image/png" href="{% static 'images/web/favicon.ico' %}">
    <link rel="stylesheet" href="{% static '/css/main.css' %}">
</head>
<body>
    <div class="w-full h-screen bg-white">
        <img class="fixed rotate-180 z-0 top-0 left-0 w-full h-screen object-cover" src="{% static 'images/web/Blobbies.png' %}" alt="" />
        {% block content %}{% endblock %}
    </div>

    {% block script %}{% endblock %}
    <script>
        $(document).ready(function() {
            feather.replace();
        });
    </script>
</body>
</html>
