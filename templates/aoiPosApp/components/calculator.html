<div id="calculatorDOM" class="w-[35vw] flex-none h-full px-[40px] py-[45px] bg-white rounded-[30px] gap-[30px] flex flex-col">
    <h2 class="text-[20px] text-[#4b4b4b] font-semibold">Chosen Items</h2>

    <div class="cartItemDOM grow w-full flex flex-col gap-2">
        {% comment %} DOM manipulated by JS in pos-dashboard.html {% endcomment %}
    </div>

    <div class="w-full">
        <div class="w-full flex gap-2 overflow-x-scroll">
            <button data-value="0" class="priceCutBtn w-full py-1 px-3 border-2 border-gray-200 text-sm rounded-full cursor-pointer hover:bg-gray-100 transition">
                0%
            </button>
            <button data-value="5" class="priceCutBtn w-full py-1 px-3 border-2 border-gray-200 text-sm rounded-full cursor-pointer hover:bg-gray-100 transition">
                5%
            </button>
            <button data-value="10" class="priceCutBtn w-full py-1 px-3 border-2 border-gray-200 text-sm rounded-full cursor-pointer hover:bg-gray-100 transition">
                10%
            </button>
            <button data-value="25" class="priceCutBtn w-full py-1 px-3 border-2 border-gray-200 text-sm rounded-full cursor-pointer hover:bg-gray-100 transition">
                25%
            </button>
            <button data-value="50" class="priceCutBtn w-full py-1 px-3 border-2 border-gray-200 text-sm rounded-full cursor-pointer hover:bg-gray-100 transition">
                50%
            </button>
            <button data-value="75" class="priceCutBtn w-full py-1 px-3 border-2 border-gray-200 text-sm rounded-full cursor-pointer hover:bg-gray-100 transition">
                75%
            </button>
            <button data-value="90" class="priceCutBtn w-full py-1 px-3 border-2 border-gray-200 text-sm rounded-full cursor-pointer hover:bg-gray-100 transition">
                90%
            </button>
            <button data-value="100" class="priceCutBtn w-full py-1 px-3 border-2 border-gray-200 text-sm rounded-full cursor-pointer hover:bg-gray-100 transition">
                Reset
            </button>
        </div>
        <p class="mb-1 font-semibold text-xs text-gray-600">
            *Applies price cut per percentage (i.e: RM100 * 50% = RM50)
        </p>
    </div>

    <div class="w-full ">
        <p class="priceCutDOM w-full text-gray-500 text-right font-semibold mb-1"></p>
        <h1 class="w-full text-right text-[32px] font-bold text-[#4b4b4b]">RM <span class="totalAmountDom">0.00</span></h1>
    </div>

    <button
        class="checkoutBtn w-full h-[46px] flex justify-center items-center bg-linear-to-r from-[#84D6FF] to-[#5188FF] font-white text-white rounded-full hover:brightness-90 cursor-pointer"
    >
        <i data-feather="shopping-cart"></i>
        Checkout
    </button>
</div>


<div class="checkoutModalDOM hidden fixed top-0 left-0 w-full h-full bg-black/20 flex items-center justify-center">
    <div class="bg-white flex flex-col gap-[24px] rounded-[30px] pt-12 pb-7 px-7 w-[450px] h-[80vh] overflow-clip">
        <div class="w-full flex gap-2 items-center">
            <button type="button" class="closeCheckoutBtn w-[30px] h-[30px] flex items-center justify-center rounded-full hover:bg-gray-200 cursor-pointer">
                <i data-feather="x" class="w-[24px]"></i>
            </button>
            <h2 class="text-[20px] text-[#4b4b4b] font-semibold">Checkout</h2>
        </div>

        <div class="cartItemDOM grow w-full flex flex-col gap-2">
            {% comment %} DOM manipulated by JS in pos-dashboard.html {% endcomment %}
            <div class="w-full h-full text-gray-500 flex items-center justify-center">
                No items selected
            </div>
        </div>

        <div class="w-full ">
            <p class="priceCutDOM w-full text-gray-500 text-right font-semibold mb-1"></p>
            <h1 class="w-full text-right text-[32px] font-bold text-[#4b4b4b]">RM <span class="totalAmountDom">0.00</span></h1>
        </div>

        <div class="w-full flex gap-3">
            <div class="failedBtn w-1/2 h-[50px] font-semibold cursor-pointer rounded-full flex items-center justify-center gap-2 border-2 border-white hover:border-gray-300 transition">
                <i data-feather="x"></i>
                Failed
            </div>
            <div class="successBtn w-1/2 h-[50px] font-semibold cursor-pointer rounded-full flex items-center justify-center gap-2 group bg-sky-400 text-white hover:brightness-90 transition">
                <i data-feather="check" class="group-hover:text-white"></i>
                Success
            </div>
        </div>
    </div>
</div>
